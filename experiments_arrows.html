<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Experiments by NASA — Flame in Freefall</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:pointer}
  svg{width:100vw;height:100vh;display:block}
  text{font-family:"Times New Roman",Times,"Liberation Serif",serif;fill:#fff}
  .title{font-size:84px;font-weight:700;text-anchor:middle}
  .item{font-size:64px;text-anchor:middle;transition:opacity .6s ease,fill .6s ease}
  .label{font-size:44px;fill:#e9edf3}
  .cap{font-size:34px;font-style:italic;fill:#9aa3b2;text-anchor:middle}

  /* reveal states */
  .fade{opacity:0;transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
  .fade.rise{transform:translateY(18px)}
  .fade.on{opacity:1;transform:none}
  #list{transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
  #list.shift{transform:translateX(-470px)}
  .item.dim{opacity:.32}
  .item.hot{fill:#ffb15e}
  .grp{transition:opacity .6s ease}
  .grp.dim{opacity:.32}

  .draw{fill:none;stroke:#ffb15e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
        stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
  .draw.on{stroke-dashoffset:0}
  .head{fill:none;stroke:#ffb15e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
        opacity:0;transition:opacity .2s ease .65s}
  .head.on{opacity:1}
  .lbl{opacity:0;transform:translateX(-14px);transition:opacity .6s ease .55s, transform .6s ease .55s}
  .lbl.on{opacity:1;transform:none}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <text id="title" class="title fade" x="960" y="200">Experiments by NASA</text>
  <g id="list">
    <text class="item fade rise" x="960" y="380">BASS-II</text>
    <text class="item fade rise" x="960" y="480">FLEX</text>
    <text class="item fade rise" x="960" y="580">ACME</text>
    <text class="item fade rise" x="960" y="680">SoFIE</text>
    <text class="item fade rise" x="960" y="780">SAFFIRE</text>
  </g>
  <g id="ann"></g>
  <text id="cap" class="cap fade" x="960" y="1010"></text>
</svg>

<script>
const NS = "http://www.w3.org/2000/svg";
const SHIFT = -470;                     // must match #list.shift
const items = [...document.querySelectorAll(".item")];
const ann = document.getElementById("ann");
const cap = document.getElementById("cap");
let showCaptions = new URLSearchParams(location.search).has("captions");
let timers = [];

function el(tag, attrs, parent = ann) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
// arrow = shaft (drawn) + head (pops in at the end)
function arrow(x0, y, x1, g) {
  const shaft = el("path", {d:`M${x0} ${y} H${x1}`, class:"draw", pathLength:1}, g);
  const head  = el("path", {d:`M${x1-16} ${y-13} L${x1} ${y} L${x1-16} ${y+13}`, class:"head"}, g);
  return [shaft, head];
}
function label(x, y, str, g) {
  const t = el("text", {x, y: y + 15, class:"label lbl"}, g);
  t.textContent = str;
  return t;
}
const right = i => { const b = items[i].getBBox(); return b.x + b.width + SHIFT; };
const midY  = i => { const b = items[i].getBBox(); return b.y + b.height * 0.55; };

let beats = {};
function build() {
  ann.innerHTML = "";
  // Speaker 1 — one arrow per experiment
  const g1 = el("g", {class:"grp"}), g2 = el("g", {class:"grp"});
  const s1 = [[0, "studies solid fuels"], [1, "explores flame extinction"]].map(([i, txt], k) => {
    const g = k ? g2 : g1, x0 = Math.max(right(0), right(1)) + 40, y = midY(i);
    return [...arrow(x0, y, x0 + 150, g), label(x0 + 180, y, txt, g)];
  });

  // Speaker 2 — brace around ACME / SoFIE / SAFFIRE → chain
  const g3 = el("g", {class:"grp"});
  const bx = Math.max(right(2), right(3), right(4)) + 40;
  const top = items[2].getBBox().y + 8, bot = (b => b.y + b.height - 4)(items[4].getBBox());
  const my = (top + bot) / 2, w = 26;
  const brace = el("path", {class:"draw", pathLength:1, d:
    `M${bx} ${top} Q${bx+w} ${top} ${bx+w} ${top+30} V${my-24} Q${bx+w} ${my} ${bx+w*2} ${my}` +
    ` Q${bx+w} ${my} ${bx+w} ${my+24} V${bot-30} Q${bx+w} ${bot} ${bx} ${bot}`}, g3);
  const a1 = arrow(bx + w*2 + 20, my, bx + w*2 + 150, g3);
  const l1 = label(bx + w*2 + 180, my, "combustion physics", g3);
  const l1end = bx + w*2 + 180 + l1.getComputedTextLength();
  const a2 = arrow(l1end + 30, my, l1end + 170, g3);
  const l2 = label(l1end + 200, my, "spacecraft-scale fires", g3);

  beats = { s1a: s1[0], s1b: s1[1], brace, a1: [...a1, l1], a2: [...a2, l2], g1, g2, g3 };
}

const on  = els => [].concat(els).forEach(e => e.classList.add("on"));
const at  = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));
const say = txt => { cap.textContent = txt; cap.classList.toggle("on", showCaptions && !!txt); };

function play() {
  timers.forEach(clearTimeout); timers = [];
  document.querySelectorAll(".on,.shift,.dim,.hot").forEach(e => e.classList.remove("on","shift","dim","hot"));
  say("");
  build();
  void document.body.offsetWidth;        // restart transitions

  at(0.1, () => on(document.getElementById("title")));
  items.forEach((it, i) => at(0.5 + i * 0.18, () => on(it)));
  at(2.2, () => document.getElementById("list").classList.add("shift"));

  // Speaker 1
  at(3.4, () => { say("“BASS-II studies solid fuels. FLEX explores flame extinction.”");
                  items.forEach((it, i) => it.classList.toggle("dim", i > 1));
                  items[0].classList.add("hot"); on(beats.s1a); });
  at(5.2, () => { items[0].classList.remove("hot"); items[1].classList.add("hot"); on(beats.s1b); });

  // Speaker 2
  at(7.4, () => { say("“ACME, SoFIE, and SAFFIRE expand that research from combustion physics to spacecraft-scale fires.”");
                  items[1].classList.remove("hot");
                  items.forEach((it, i) => { it.classList.toggle("dim", i < 2); it.classList.toggle("hot", i > 1); });
                  beats.g1.classList.add("dim"); beats.g2.classList.add("dim");
                  on(beats.brace); });
  at(8.3, () => on(beats.a1));
  at(10.0, () => on(beats.a2));

  // Settle: everything visible
  at(12.5, () => { items.forEach(it => it.classList.remove("dim","hot"));
                   [beats.g1, beats.g2].forEach(g => g.classList.remove("dim")); });
}

document.addEventListener("click", play);
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "r") { e.preventDefault(); play(); }
  if (e.key === "c") { showCaptions = !showCaptions; cap.classList.toggle("on", showCaptions && !!cap.textContent); }
});
(document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
</script>
</body>
</html>
